<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>錄影 → 音檔</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#25362f;font:16px system-ui,-apple-system,sans-serif}main{max-width:800px;margin:60px auto;padding:24px}.tag{color:#617869;font-size:13px;letter-spacing:2px}h1{font-size:clamp(36px,7vw,58px);margin:14px 0}p{line-height:1.8;color:#68746c}.box{background:white;border:1px solid #dedfd5;border-radius:24px;padding:28px;margin:26px 0}.drop{text-align:center;border:2px dashed #bdcabb;border-radius:16px;padding:35px 16px;background:#f8faf5}button,.pick,a.download{font:inherit;background:#284d3d;color:white;border:0;padding:13px 22px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.45;cursor:wait}.secondary{background:#eaf0e7;color:#294737}input[type=file]{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.item{border-top:1px solid #e9ebe5;padding:16px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}.name{overflow-wrap:anywhere}.state{font-size:13px;color:#748375;margin-top:5px}a.download{padding:9px 14px;font-size:14px;flex-shrink:0}.note{font-size:13px}progress{width:100%;height:10px;accent-color:#284d3d;margin:16px 0}footer{font-size:13px;color:#79857c}#status{min-height:26px}label:focus-within{outline:2px solid #284d3d}@media(max-width:600px){main{margin:16px auto;padding:18px}.box{padding:20px}.item{align-items:flex-start}}</style><main><div class="tag">LOCAL AUDIO TOOL</div><h1>把錄影，變成歌。</h1><p>一次選取多支 iPhone 螢幕錄影，在瀏覽器裡批量轉成音檔。<br>不用安裝程式，影片不會上傳。</p><section class="box"><div class="drop" id="drop"><div style="font-size:36px;margin-bottom:12px">♫</div><label class="pick" tabindex="0" id="pick">選取多支影片<input id="files" type="file" accept="video/*,.mov,.mp4,.m4v" multiple></label><p class="note">也可以把影片拖曳到這裡</p></div><p class="note">輸出：WAV 音檔 · 保留原檔名 · 原影片不會刪除<br>WAV 檔案較大，適合先轉出音訊。此版不輸出 MP3／M4A。</p><div class="actions"><button id="start" disabled>開始批量轉換</button><button class="secondary" id="clear">清空清單</button></div><progress id="progress" value="0" max="1"></progress><div id="status" role="status" aria-live="polite">尚未選取影片</div><div id="list"></div></section><footer>電腦建議使用 Chrome／Edge；iPhone 可用 Safari。瀏覽器的格式支援與記憶體會影響轉換，長影片建議用電腦。轉換時保持頁面開啟；離開或重新整理後需重新選取檔案。</footer></main><script>
const $=id=>document.getElementById(id);let items=[],busy=false,ctx=null;
function wav(buffer){const channels=Math.min(buffer.numberOfChannels,2), frames=buffer.length, bytes=frames*channels*2;if(bytes>0xffffffff-36)throw Error('音訊太長，超過 WAV 檔案大小上限');const a=new ArrayBuffer(44+bytes),v=new DataView(a);function str(offset,text){for(let i=0;i<text.length;i++)v.setUint8(offset+i,text.charCodeAt(i))}str(0,'RIFF');v.setUint32(4,36+bytes,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,channels,true);v.setUint32(24,buffer.sampleRate,true);v.setUint32(28,buffer.sampleRate*channels*2,true);v.setUint16(32,channels*2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,bytes,true);const data=Array.from({length:channels},(_,i)=>buffer.getChannelData(i));let pos=44;for(let i=0;i<frames;i++)for(let c=0;c<channels;c++){let sample=Math.max(-1,Math.min(1,data[c][i]));v.setInt16(pos,sample<0?sample*32768:sample*32767,true);pos+=2}return new Blob([a],{type:'audio/wav'})}
function add(files){if(busy)return;for(const f of files){if(items.some(i=>i.file.name===f.name&&i.file.size===f.size&&i.file.lastModified===f.lastModified))continue;const row=document.createElement('div');row.className='item';const body=document.createElement('div'),name=document.createElement('div'),state=document.createElement('div');name.className='name';name.textContent=f.name;state.className='state';state.textContent=(f.size/1048576).toFixed(1)+' MB · 等待轉換';body.append(name,state);row.append(body);$('list').append(row);items.push({file:f,row,state,url:null})}update()}
function update(){$('start').disabled=busy||!items.some(i=>!i.url);$('clear').disabled=busy;$('files').disabled=busy;$('status').textContent='已選取 '+items.length+' 支影片'}
$('files').onchange=e=>{add(e.target.files);e.target.value=''};$('pick').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!busy)$('files').click()}};
$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();add(e.dataTransfer.files)};
$('clear').onclick=()=>{if(busy)return;for(const i of items)if(i.url)URL.revokeObjectURL(i.url);items=[];$('list').replaceChildren();$('progress').value=0;update()};
$('start').onclick=async()=>{if(busy)return;busy=true;update();const pending=items.filter(i=>!i.url);$('progress').max=pending.length;$('progress').value=0;let ok=0;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('此瀏覽器不支援音訊解碼');ctx=new Audio();await ctx.resume();for(const [n,item]of pending.entries()){$('status').textContent=`正在轉換 ${n+1}/${pending.length}，請保持頁面開啟`;item.state.textContent='正在讀取與轉換…';await new Promise(r=>setTimeout(r,30));try{if(item.file.size>250*1048576)throw Error('影片超過 250 MB，請先切成較短片段');let input=await item.file.arrayBuffer();let audio=await ctx.decodeAudioData(input);input=null;const blob=wav(audio);audio=null;item.url=URL.createObjectURL(blob);const link=document.createElement('a');link.className='download';link.href=item.url;const stem=item.file.name.replace(/\.[^.]+$/,'')||'audio';const count=items.slice(0,items.indexOf(item)).filter(i=>(i.file.name.replace(/\.[^.]+$/,'')||'audio')===stem).length;link.download=stem+(count?` (${count+1})`:'')+'.wav';link.textContent='下載音檔';item.row.append(link);item.state.textContent=(blob.size/1048576).toFixed(1)+' MB · 轉換完成';ok++}catch(e){item.state.textContent='失敗：'+(e.message.includes('decode')||e.name==='EncodingError'?'瀏覽器無法解碼此影片，可能無音軌或格式不支援；可改用電腦 Chrome／Edge。':e.message)}$('progress').value=n+1}}catch(e){$('status').textContent='無法開始：'+e.message}finally{if(ctx){await ctx.close().catch(()=>{});ctx=null}busy=false;update();$('status').textContent=`本批完成：成功 ${ok} 支，失敗 ${pending.length-ok} 支。請點各檔案的「下載音檔」。`}};
window.addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue=''}});
</script></html>
